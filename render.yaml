databases:
  - name: groosin-kitchen-db
    databaseName: groosin_kitchen
    user: groosin_kitchen_user
    plan: free

services:
  - type: web
    name: groosin-kitchen
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && gunicorn georgian_restaurant.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: groosin-kitchen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
