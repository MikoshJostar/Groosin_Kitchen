services:
  - type: web
    name: groosin-kitchen
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn georgian_restaurant.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: groosin-db
          property: connectionString
      - key: SEED_DATA
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # введете вручну в Render

databases:
  - name: groosin-db
    plan: free
